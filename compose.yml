services:
  database:
    image: pgvector/pgvector:pg18
    container_name: photos_database
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-photos}
      POSTGRES_USER: ${DB_USER:-photos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-photos_user} -d ${DB_NAME:-photos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: photos-server:latest
    container_name: photos_api
    restart: always
    command: ["photos-api"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-photos_user}:${DB_PASSWORD:-dev-password}@database:5432/${DB_NAME:-photos}
      APP__SECRETS__JWT: ${JWT_SECRET:-change_me_in_production}
      APP__INGEST__MEDIA_FOLDER: /media
      APP__INGEST__APP_DATA_FOLDER: /app_data
      APP__API__HOST: "0.0.0.0"
      APP__API__PORT: "9475"
    volumes:
      - ${MEDIA_LOCATION}:/media
      - ${APP_DATA_LOCATION}:/app_data

  scaler:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: photos-server:latest
    container_name: photos_scaler
    restart: always
    command: ["photos-scaler"]
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${DB_USER:-photos_user}:${DB_PASSWORD:-dev-password}@database:5432/${DB_NAME:-photos}
      APP__SECRETS__JWT: ${JWT_SECRET:-change_me_in_production}
      APP__INGEST__MEDIA_FOLDER: /media
      APP__INGEST__APP_DATA_FOLDER: /app_data
    volumes:
      - ${MEDIA_LOCATION}:/media
      - ${APP_DATA_LOCATION}:/app_data

  watcher:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: photos-server:latest
    container_name: photos_watcher
    restart: always
    command: ["photos-watcher"]
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${DB_USER:-photos_user}:${DB_PASSWORD:-dev-password}@database:5432/${DB_NAME:-photos}
      APP__SECRETS__JWT: ${JWT_SECRET:-change_me_in_production}
      APP__INGEST__MEDIA_FOLDER: /media
      APP__INGEST__APP_DATA_FOLDER: /app_data
    volumes:
      - ${MEDIA_LOCATION}:/media
      - ${APP_DATA_LOCATION}:/app_data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: photos-web:latest
    container_name: photos_web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata: