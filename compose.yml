services:
  database:
    image: pgvector/pgvector:pg18
    container_name: photos_database
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-photos}
      POSTGRES_USER: ${DB_USER:-photos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password}
    volumes:
      - photos_pgdata:/var/lib/postgresql
    ports:
      - "6543:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-photos_user} -d ${DB_NAME:-photos}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: photos-server:latest
    container_name: photos_backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-photos_user}:${DB_PASSWORD:-dev-password}@database:5432/${DB_NAME:-photos}
      APP__SECRETS__JWT: ${JWT_SECRET:-change_me_in_production}
      APP__INGEST__MEDIA_FOLDER: /media
      APP__INGEST__APP_DATA_FOLDER: /app_data
      APP__CONSTANTS__FALLBACK_TIMEZONE: ${TZ:-Europe/Amsterdam}
      APP__API__HOST: "0.0.0.0"
      APP__API__PORT: "5272"
      APP__API__SERVE_STATIC_ASSETS: "false"
    volumes:
      - ${MEDIA_LOCATION}:/media
      - ${APP_DATA_LOCATION:-photos_app_data}:/app_data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5272/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: photos-web:latest
    container_name: photos_web
    restart: always
    ports:
      - "${WEB_PORT:-9475}:9475"
    volumes:
      - ${APP_DATA_LOCATION:-photos_app_data}:/app_data:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  photos_pgdata:
  photos_app_data: