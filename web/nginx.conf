server {
    listen 80;
    server_name localhost;

    # Allow large media file uploads
    client_max_body_size 50G;
    client_body_buffer_size 128k;

    # Gzip compression for frontend assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API and static media endpoints
    location ~ ^/(api|thumbnails|hosted) {
        proxy_pass http://api:5272;
        proxy_http_version 1.1;

        # Headers required for WebSockets and streaming uploads
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Disable buffering for resumable uploads (TUS protocol)
        proxy_request_buffering off;
        proxy_buffering off;
    }
}