map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve outer TLS scheme/host when behind another reverse proxy
# (e.g. photos.ruurd.dev -> web:9475 -> backend:5272).
# $scheme here is http inside the docker network, so don't overwrite
# an existing X-Forwarded-Proto: https with http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 9475;
    server_name localhost;

    # Allow large media uploads
    client_max_body_size 50G;
    client_body_buffer_size 128k;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Web App
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Thumbnail Serving
    location /thumbnails/ {
        alias /app_data/hosted/thumbnails/;
        sendfile on;
        tcp_nopush on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static Hosted Files
    location /hosted/ {
        alias /app_data/hosted/;
        sendfile on;
        tcp_nopush on;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Proxy API & WebSockets to backend
    location ~ ^/(api) {
        proxy_pass http://backend:5272;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;

        proxy_request_buffering off;
        proxy_buffering off;
    }
}