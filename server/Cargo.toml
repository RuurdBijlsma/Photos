[workspace]
resolver = "3"
members = [
    # Apps
    "crates/apps/api",
    "crates/apps/worker",
    "crates/apps/worker_scaler",
    "crates/apps/watcher",
    "crates/apps/photos_app",
    # Libs
    "crates/libs/tasks",
    "crates/libs/app_state",
    "crates/libs/common_types",
    "crates/libs/common_services",
    "crates/libs/ml_analysis",
    "crates/libs/model_provider",
    "crates/libs/generate_thumbnails",
    # Integration tests
    "crates/test_integration"
]

[profile.release-docker]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
