[package]
name = "test_integration"
version = "0.1.0"
edition = "2024"

[dependencies]
photos_app = { path = "../apps/photos_app" }
model_provider = { path = "../libs/model_provider" }
app_state = { path = "../libs/app_state" }
common_services = { path = "../libs/common_services" }
common_types = { path = "../libs/common_types" }

tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
tokio = { version = "1.35.1", features = ["full"] }
color-eyre = "0.6.2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "macros", "json", "uuid"] }
tempfile = "3.9.0"
reqwest = { version = "0.13.2", features = ["json", "query", "cookies"] }
url = "2.5.7"
colored = "3.0.0"
chrono = { version = "0.4.42", features = ["serde"] }
walkdir = "2.5.0"
serde_json = "1.0.145"
prost = "0.14.3"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = "0.3.31"
material-color-utils = "0.1.3"

[features]
load-dynamic = [
    "photos_app/load-dynamic",
    "common_services/load-dynamic",
    "common_types/load-dynamic",
    "model_provider/load-dynamic",
]