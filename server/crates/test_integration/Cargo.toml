[package]
name = "test_integration"
version = "0.1.0"
edition = "2024"

[dependencies]
photos_app = { path = "../apps/photos_app" }
model_provider = { path = "../libs/model_provider" }
app_state = { path = "../libs/app_state" }
common_services = { path = "../libs/common_services" }
common_types = { path = "../libs/common_types" }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.53.2", features = ["full"] }
color-eyre = "0.6.5"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "macros", "json", "uuid"] }
tempfile = "3.27.0"
reqwest = { version = "0.13.5", features = ["json", "query", "cookies"] }
url = "2.5.8"
colored = "3.1.1"
chrono = { version = "0.4.45", features = ["serde"] }
walkdir = "2.5.0"
serde_json = "1.0.151"
prost = "0.14.4"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3.34"
material-color-utils = "0.1.3"

[features]
load-dynamic = [
    "photos_app/load-dynamic",
    "common_services/load-dynamic",
    "common_types/load-dynamic",
    "model_provider/load-dynamic",
]
