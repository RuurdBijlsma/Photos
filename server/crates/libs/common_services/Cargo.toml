[package]
name = "common_services"
version = "0.1.0"
edition = "2024"

[dependencies]
app_state = { path = "../../libs/app_state" }
common_types = { path = "../../libs/common_types" }
media_analyzer = "0.10.3"
tracing = "0.1.41"
color-eyre = "0.6.5"
axum = { version = "0.8.8", features = ["macros", "ws", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
jsonwebtoken = { version = "10.0.0", features = ["rust_crypto"] }
argon2 = { version = "0.6.0-rc.8" }
chrono = { version = "0.4.42", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "macros", "json", "uuid"] }
rand = "0.10.0-rc.9"
base64 = "0.22.1"
serde_json = "1.0.145"
thiserror = "2.0.17"
tempfile = "3.23.0"
fs2 = "0.4.3"
walkdir = "2.5.0"
fastrand = "2.3.0"
mime_guess = "2.0.5"
tokio-util = { version = "0.7.16", features = ["codec"] }
http = "1.3.1"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
url = { version = "2.5.7", features = ["serde"] }
bon = "3.8.1"
pgvector = { version = "0.4.2", features = ["sqlx", "serde"] }
futures-util = "0.3.31"
open_clip_inference = { version = "0.4.0" }
kamadak-exif = "0.6.1"
imagesize = "0.14.0"
fast_image_resize = { version = "6.0.0", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
face_id = "0.4.0"
material-color-utils = "0.1.3"
moka = { version = "0.12.15", features = ["future"] }
object_detector = "0.5.0"
blake3 = "1.8.5"

[dev-dependencies]
criterion = { version = "0.8.0", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "timeline_benchmark"
harness = false

[[bench]]
name = "system_bench"
harness = false

[features]
load-dynamic = [
    "open_clip_inference/load-dynamic",
    "face_id/load-dynamic",
    "common_types/load-dynamic",
    "object_detector/load-dynamic",
] # -> Load ONNXRuntime dynamically instead of statically