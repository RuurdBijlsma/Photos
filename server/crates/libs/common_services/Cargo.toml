[package]
name = "common_services"
version = "0.1.0"
edition = "2024"

[dependencies]
app_state = { path = "../../libs/app_state" }
common_types = { path = "../../libs/common_types" }
media_analyzer = "0.10.6"
tracing = "0.1.44"
color-eyre = "0.6.5"
axum = { version = "0.8.9", features = ["macros", "ws", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
argon2 = { version = "0.6.0" }
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "macros", "json", "uuid"] }
rand = "0.10.3"
base64 = "0.23.1"
serde_json = "1.0.151"
thiserror = "2.0.21"
tempfile = "3.27.0"
fs2 = "0.4.3"
walkdir = "2.5.0"
fastrand = "2.5.0"
mime_guess = "2.0.5"
tokio-util = { version = "0.7.19", features = ["codec"] }
http = "1.5.0"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
url = { version = "2.5.8", features = ["serde"] }
bon = "3.10.2"
pgvector = { version = "0.4.2", features = ["sqlx", "serde"] }
futures-util = "0.3.34"
open_clip_inference = { version = "0.4.2" }
kamadak-exif = "0.6.1"
imagesize = "0.15.0"
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
face_id = "0.4.4"
material-color-utils = "0.1.3"
moka = { version = "0.12.16", features = ["future"] }
object_detector = "0.5.2"
blake3 = "1.8.7"
exiftool = "0.3.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "timeline_benchmark"
harness = false

[[bench]]
name = "system_bench"
harness = false

[features]
load-dynamic = [
    "open_clip_inference/load-dynamic",
    "face_id/load-dynamic",
    "common_types/load-dynamic",
    "object_detector/load-dynamic",
] # -> Load ONNXRuntime dynamically instead of statically
