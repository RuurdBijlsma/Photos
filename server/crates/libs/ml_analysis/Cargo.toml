[package]
name = "ml_analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
app_state = { path = "../../libs/app_state" }
common_types = { path = "../common_types" }
serde_json = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
image = { version = "0.25.10" }
palette = "0.7.7"
color-eyre = "0.6.5"
imageproc = { version = "0.27.0" }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
open_clip_inference = { version = "0.4.2" }
tracing = "0.1.44"
face_id = "0.4.4"
object_detector = "0.5.2"
material-color-utils = "0.1.3"

[dev-dependencies]
walkdir = "2.5.0"
rayon = "1.12.0"

[features]
load-dynamic = [
    "open_clip_inference/load-dynamic",
    "face_id/load-dynamic",
    "object_detector/load-dynamic"
] # -> Load ONNXRuntime dynamically instead of statically
