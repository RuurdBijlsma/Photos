ingest:
  media_folder: C:\Users\Ruurd\Pictures\media_dir
  app_data_folder: ../app_data
  enable_cache: true

  analyzer:
    search:
      embedder_model_id: RuteNL/MobileCLIP2-S3-OpenCLIP-ONNX
      semantic_score_threshold: 0.8
      semantic_weight: 0.5
      text_weight: 0.5
    analyze_image_size: 720
    theme_generation:
      variant: Vibrant
    onnx:
      inter_threads: 1
      intra_threads: 4

  file_detection:
    video_extensions:
      - "mp4"
      - "webm"
      - "av1"
      - "3gp"
      - "mov"
      - "mkv"
      - "flv"
      - "m4v"
      - "m4p"
    photo_extensions:
      - "jpg"
      - "jpeg"
      - "png"
      - "gif"
      - "tiff"
      - "tga"
      - "avif"
      - "heic"
      - "heif"

  thumbnails:
    recreate_if_exists: false
    heights:
      - 144
      - 240
      - 360
      - 480
      - 720
      - 1080
      - 1440
    thumbnail_extension: "avif"
    avif_options:
      quality: 80
      alpha_quality: 80
      speed: 4
    video_options:
      extension: "webm"
      thumb_time: 0.5
      percentages:
        - 0
        - 33
        - 66
        - 99
      height: 720
      transcode_outputs:
        - height: 480
          quality: 35
        - height: 144
          quality: 40

logging:
  filters:
    main: info
    targets:
      ort: warn
      api: debug
      tower_http: debug
      hf_hub: error
      xet_client: warn
      xet_data: warn
      xet_runtime: warn
      xet: warn
      open_clip_inference: warn
      object_detector: warn
      face_id: warn
      sqlx: warn

api:
  host: "0.0.0.0"
  port: 5272
  serve_static_assets: true
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "https://ruurdbijlsma.github.io"
  public_url: "http://localhost:5272"
  cookie_secure: false
  rate_limiting:
    req_per_second: 6
    burst_size: 10

secrets:
  jwt: "overwrite-me-with-env"

constants:
  allow_file_modifications: true
  allow_file_deletion: true
  fallback_timezone: Europe/Amsterdam
  onboarding_n_media_samples: 8
  
  database:
    max_connections: 20
    min_connection: 3
    max_lifetime: 1800
    idle_timeout: 600
    acquire_timeout: 30
    media_item_id_length: 10
    album_id_length: 10

  auth:
    access_token_expiry_minutes: 30
    refresh_token_expiry_days: 7
    upload_token_expiry_minutes: 5
    album_invitation_expiry_minutes: 1440 # 24 hours

daily_cards:
  cluster:
    min_cards: 1
    max_cards: 3
  estimatr:
    rounds_per_day: 3

scaler:
  tick_interval_secs: 10
  quick_tick_interval_secs: 3
  system_memory_buffer_percentage: 5.0
  system_memory_buffer_maximum_mb: 1000
  unload_models_timeout_secs: 30 # 16 hours
  profiles:
    light:
      priority: 1
      estimated_ram_mb: 100
      max_workers: 5
      excluded_jobs:
        - "ingest_thumbnails" # Needs worker limit
        - "ingest_analysis" # Needs VisualAnalysis (CLIP visual embedder, face models, object detection models)
        - "cluster_photos" # Needs CLIP text embedder model
    thumbnails:
      priority: 2
      estimated_ram_mb: 1000
      max_workers: 2
      excluded_jobs:
        - "ingest_analysis"
        - "cluster_photos"
    ml:
      priority: 3
      estimated_ram_mb: 1000
      max_workers: 2
      excluded_jobs:
        - "ingest_thumbnails"