services:
  database:
    image: pgvector/pgvector:pg18
    container_name: photos_database
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-photos}
      POSTGRES_USER: ${DB_USER:-photos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password}
    volumes:
      - photos_pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-photos_user} -d ${DB_NAME:-photos}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/ruurdbijlsma/photos-server:latest
    container_name: photos_backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${DB_USER:-photos_user}:${DB_PASSWORD:-dev-password}@database:5432/${DB_NAME:-photos}
      RP__SECRETS__JWT: ${JWT_SECRET:-change_me_in_production}
      RP__INGEST__MEDIA_FOLDER: /media
      RP__INGEST__APP_DATA_FOLDER: /app_data
      RP__CONSTANTS__FALLBACK_TIMEZONE: ${TZ:-Europe/Amsterdam}
      RP__API__HOST: "0.0.0.0"
      RP__API__PORT: "5272"
      RP__API__SERVE_STATIC_ASSETS: "false"
    volumes:
      - ${MEDIA_LOCATION}:/media
      - ${APP_DATA_LOCATION:-photos_app_data}:/app_data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5272/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: ghcr.io/ruurdbijlsma/photos-web:latest
    container_name: photos_web
    restart: always
    ports:
      - "${WEB_PORT:-9475}:9475"
    volumes:
      - ${APP_DATA_LOCATION:-photos_app_data}:/app_data:ro
    depends_on:
      backend:
        condition: service_healthy

  # Optional monitoring stack. Off by default:
  #   docker compose --profile monitoring up -d
  loki:
    image: ghcr.io/ruurdbijlsma/photos-loki:latest
    container_name: photos_loki
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - -config.file=/etc/loki/config.yaml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-30}
    volumes:
      - photos_loki_data:/loki

  alloy:
    image: ghcr.io/ruurdbijlsma/photos-alloy:latest
    container_name: photos_alloy
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - photos_alloy_data:/var/lib/alloy/data
      - ${APP_DATA_LOCATION:-photos_app_data}:/app_data:ro
    depends_on:
      - loki

  grafana:
    image: ghcr.io/ruurdbijlsma/photos-grafana:latest
    container_name: photos_grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${GRAFANA_PORT:-9476}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      POSTGRES_USER: ${DB_USER:-photos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password}
      POSTGRES_DB: ${DB_NAME:-photos}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - photos_grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - database

volumes:
  photos_pgdata:
  photos_app_data:
  photos_loki_data:
  photos_alloy_data:
  photos_grafana_data:
