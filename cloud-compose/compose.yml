name: photos

x-backend-common: &backend-common
  image: ghcr.io/ruurdbijlsma/photos-server:latest
  restart: always
  environment: &backend-env
    DATABASE_URL: postgresql://${DB_USER:-photos_user}:${DB_PASSWORD:-dev-password}@database:5432/${DB_NAME:-photos}
    APP__SECRETS__JWT: ${JWT_SECRET:-change_me_in_production}
    APP__INGEST__MEDIA_FOLDER: /media
    APP__INGEST__APP_DATA_FOLDER: /app_data
    APP__CONSTANTS__FALLBACK_TIMEZONE: ${TZ:-Europe/Amsterdam}
  volumes:
    - ${MEDIA_LOCATION}:/media
    - ${APP_DATA_LOCATION:-app_data}:/app_data

services:
  database:
    image: pgvector/pgvector:pg18
    container_name: photos_database
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-photos}
      POSTGRES_USER: ${DB_USER:-photos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-photos_user} -d ${DB_NAME:-photos}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    <<: *backend-common
    container_name: photos_api
    command: [ "photos-api" ]
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *backend-env
      APP__API__HOST: "0.0.0.0"
      APP__API__PORT: "5272"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5272/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  scaler:
    <<: *backend-common
    container_name: photos_scaler
    command: [ "photos-scaler" ]
    depends_on:
      database:
        condition: service_healthy

  watcher:
    <<: *backend-common
    container_name: photos_watcher
    command: [ "photos-watcher" ]
    depends_on:
      database:
        condition: service_healthy

  web:
    image: ghcr.io/ruurdbijlsma/photos-web:latest
    container_name: photos_web
    restart: always
    ports:
      - "${WEB_PORT:-9475}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  app_data: