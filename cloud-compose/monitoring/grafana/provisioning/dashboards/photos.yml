apiVersion: 1

providers:
  - name: photos
    orgId: 1
    folder: Photos
    folderUid: photos
    type: file
    disableDeletion: false
    # Polling matters: filesystem watch events do not cross Docker bind mounts.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
