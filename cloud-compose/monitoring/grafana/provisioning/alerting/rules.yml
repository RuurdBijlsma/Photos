apiVersion: 1

groups:
  - orgId: 1
    name: Photos Alerts
    folder: Photos
    interval: 1m
    rules:
      - uid: photos_alert_macro
        title: Photos backend ALERT! log fired
        condition: A
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              expr: sum by (alert_content) (count_over_time({job="photos-backend"} |= "ALERT:" | json | label_format alert_content=message [1m])) > 0
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Photos backend ALERT! log fired
          description: A backend alert log entry was recorded.
        labels:
          severity: critical

      - uid: photos_job_failures
        title: Photos background job failed
        condition: B
        data:
          - refId: A
            queryType: table
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: postgres
            model:
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT id::text AS job_id, job_type::text AS job_type, COALESCE(last_error, 'No error details recorded') AS error, 1::bigint AS failed FROM jobs WHERE status = 'failed' AND finished_at >= NOW() - INTERVAL '5 minutes'"
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Background job failures detected
          description: A background job failed within the last 5 minutes.
        labels:
          severity: warning
