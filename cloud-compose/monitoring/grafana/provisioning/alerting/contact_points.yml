apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-alert
    receivers:
      - uid: telegram-admin
        type: telegram
        disableResolveMessage: true
        settings:
          bottoken: $__env{TELEGRAM_BOT_TOKEN}
          chatid: $__env{TELEGRAM_CHAT_ID}
          message: |-
            <b>Ruurd Photos</b>
            {{ range .Alerts -}}
            {{ if .Labels.alert_content }}{{ html .Labels.alert_content }}{{ else if .Labels.job_id }}Job {{ .Labels.job_id }} ({{ .Labels.job_type }}) failed: {{ html .Labels.error }}{{ else if (index .Annotations "description") }}{{ html (index .Annotations "description") }}{{ else }}{{ html .Labels.alertname }}{{ end }}
            {{ end }}
          parse_mode: HTML
