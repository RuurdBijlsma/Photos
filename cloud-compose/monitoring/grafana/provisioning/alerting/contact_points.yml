apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-alert
    receivers:
      - uid: telegram-admin
        type: telegram
        disableResolveMessage: true
        settings:
          bottoken: $__env{TELEGRAM_BOT_TOKEN}
          chatid: $__env{TELEGRAM_CHAT_ID}
          message: |-
            <b>Ruurd Photos Alert</b>

            {{ range .Alerts -}}
            {{ html .Annotations.description }}
            {{ end }}
          parse_mode: HTML
